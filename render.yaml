services:
  - type: web
    name: roots-employee-task-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
